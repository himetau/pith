[package]
name = "pith-native"
version = "0.3.0"
description = "A desktop for pi"
edition = "2021"

[[bin]]
name = "pith"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
async-channel = "2"
tiny_http = "0.12"
notify = "8"
portable-pty = "0.9"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
trash = "5"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
anyhow = "1"
futures = "0.3"

# a nix build on macos has no metal compiler to run at build time, so the shaders compile when pith starts instead
[features]
runtime-shaders = ["gpui-pre-platform/runtime_shaders"]

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-platform = "=0.3.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
