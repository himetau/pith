[package]
name = "pith-native"
version = "0.3.0"
description = "A desktop for pi"
edition = "2021"

[[bin]]
name = "pith"
path = "src/main.rs"

[dependencies]
# tree-sitter grammars for code blocks and tool bodies. a short list, each grammar is a c parser compiled in
gpui-kit = { version = "0.8.0", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-html", "tree-sitter-css", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-diff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
async-channel = "2"
tiny_http = "0.12"
notify = "8"
portable-pty = "0.9"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
trash = "5"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
anyhow = "1"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
