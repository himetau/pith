[package]
name = "pith-native"
version = "0.3.0"
description = "A desktop for pi"
edition = "2021"

[[bin]]
name = "pith"
path = "src/main.rs"

[dependencies]
# tree-sitter grammars for code blocks and tool bodies. a short list, each grammar is a c parser compiled in
gpui-kit = { version = "0.8.0", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-html", "tree-sitter-css", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-diff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
async-channel = "2"
tiny_http = "0.12"
notify = "8"
portable-pty = "0.9"
alacritty_terminal = "0.26"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
trash = "5"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
anyhow = "1"
futures = "0.3"
async-io = "2"

# a nix build on macos has no metal compiler to run at build time, so the shaders compile when pith starts instead
[features]
runtime-shaders = ["gpui-pre-platform/runtime_shaders"]

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-platform = "=0.3.9"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "NSURLRequest"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSWindow", "NSResponder", "NSView"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKContentWorld", "WKSnapshotConfiguration", "WKFrameInfo", "block2", "objc2-app-kit"] }

# web pages render offscreen in webkitgtk, see core/web.rs
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
javascriptcore-rs = "1"
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
