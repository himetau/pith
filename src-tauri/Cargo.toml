[package]
name = "pith"
version = "0.2.0"
description = "A desktop for pi"
edition = "2021"

[lib]
name = "pith_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tiny_http = "0.12"
notify = "8"
portable-pty = "0.9"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
trash = "5"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"

# screenshots, pane placement and the refresh rate fixes go through the platform's webview directly
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
javascriptcore-rs = "1"
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
