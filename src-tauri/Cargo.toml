[package]
name = "pith"
version = "0.2.0"
description = "A desktop for pi"
edition = "2021"

[lib]
name = "pith_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tiny_http = "0.12"
notify = "8"
portable-pty = "0.9"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
trash = "5"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
webkit2gtk = { version = "2", features = ["v2_40"] }
javascriptcore-rs = "1"
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
